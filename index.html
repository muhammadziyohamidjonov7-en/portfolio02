<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammadziyo Homidjonov | Frontend React Developer</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        darkBg: '#030712',
                        lightBg: '#f8fafc',
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome belgilar kutubxonasi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Uslublari, Orqa fon va Kursor animatsiyalari -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Kompyuterda standart kursor o'rniga maxsus animatsiyali kursor ishlatish */
        @media (min-width: 768px) {
            body, button, a {
                cursor: none;
            }
        }

        /* Scrollbar dizayni */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2563eb;
        }

        /* Glassmorphism effekti */
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .light .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        /* Orqa fon qimirlab turuvchi nurlar animatsiyasi (Background Blobs) */
        @keyframes blob1 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(100px, -120px) scale(1.25); }
            66% { transform: translate(-70px, 80px) scale(0.9); }
        }

        @keyframes blob2 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(-110px, 90px) scale(1.2); }
            66% { transform: translate(80px, -90px) scale(0.85); }
        }

        .animate-blob1 {
            animation: blob1 12s infinite ease-in-out;
        }

        .animate-blob2 {
            animation: blob2 16s infinite ease-in-out;
        }

        /* Elementlar silliq suzishi */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .animate-glow {
            animation: pulseGlow 5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white transition-colors duration-300">

    <!-- React Ildiz Konteyneri -->
    <div id="root"></div>

    <!-- Ishonchli React va Babel CDN-lari -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- React Kodi -->
    <script type="text/babel">
        function App() {
            const [loading, setLoading] = React.useState(true);
            const [progress, setProgress] = React.useState(0);
            const [darkMode, setDarkMode] = React.useState(true);
            const [lang, setLang] = React.useState('UZ');
            const [isResumeOpen, setIsResumeOpen] = React.useState(false);
            const [selectedProject, setSelectedProject] = React.useState(null);
            
            // Sichqoncha va uning ortidan ergashuvchi (Trailing) kursor state'lari
            const [mousePos, setMousePos] = React.useState({ x: -100, y: -100 });
            const [trailPos, setTrailPos] = React.useState({ x: -100, y: -100 });
            const [cursorVisible, setCursorVisible] = React.useState(false);

            // Sichqoncha harakatini silliq kuzatish va orqasidan yuritish
            React.useEffect(() => {
                let animationFrameId;
                let currentX = -100, currentY = -100;
                let targetX = -100, targetY = -100;

                const handleMouseMove = (e) => {
                    targetX = e.clientX;
                    targetY = e.clientY;
                    setMousePos({ x: targetX, y: targetY });
                    if (!cursorVisible) setCursorVisible(true);
                };

                const handleMouseLeave = () => setCursorVisible(false);

                const animateTrail = () => {
                    // Silliq ergashish uchun lag (iner intensidad) koeffitsiyenti
                    currentX += (targetX - currentX) * 0.2;
                    currentY += (targetY - currentY) * 0.2;
                    setTrailPos({ x: currentX, y: currentY });
                    animationFrameId = requestAnimationFrame(animateTrail);
                };

                window.addEventListener('mousemove', handleMouseMove);
                document.body.addEventListener('mouseleave', handleMouseLeave);
                animationFrameId = requestAnimationFrame(animateTrail);

                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    document.body.removeEventListener('mouseleave', handleMouseLeave);
                    cancelAnimationFrame(animationFrameId);
                };
            }, [cursorVisible]);

            // 1% dan 100% gacha yuklanish animatsiyasi
            React.useEffect(() => {
                let currentProgress = 0;
                const interval = setInterval(() => {
                    currentProgress += 2;
                    if (currentProgress <= 100) {
                        setProgress(currentProgress);
                    } else {
                        clearInterval(interval);
                        setTimeout(() => setLoading(false), 300);
                    }
                }, 25);
                return () => clearInterval(interval);
            }, []);

            const toggleTheme = () => {
                setDarkMode(!darkMode);
                if (darkMode) {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                } else {
                    document.documentElement.classList.remove('light');
                    document.documentElement.classList.add('dark');
                }
            };

            const t = {
                UZ: {
                    navHome: "Asosiy",
                    navSkills: "Ko'nikmalar",
                    navProjects: "Loyihalar",
                    navContact: "Bog'lanish",
                    heroTitle: "Frontend React Dasturchi",
                    heroDesc: "Interaktiv, zamonaviy va tez ishlaydigan veb-ilovalar va platformalar yarataman.",
                    projectsTitle: "Mening Loyihalarim",
                    skillsTitle: "Texnik Ko'nikmalar",
                    resumeBtn: "Resume",
                    downloadResume: "Rezyumeni Chop Etish / Yuklash",
                    viewProject: "Loyihani Ko'rish",
                    close: "Yopish",
                },
                ENG: {
                    navHome: "Home",
                    navSkills: "Skills",
                    navProjects: "Projects",
                    navContact: "Contact",
                    heroTitle: "Frontend React Developer",
                    heroDesc: "Building interactive, modern, and high-performance web applications.",
                    projectsTitle: "My Projects",
                    skillsTitle: "Technical Skills",
                    resumeBtn: "Resume",
                    downloadResume: "Print / Download Resume",
                    viewProject: "View Project",
                    close: "Close",
                },
                RUS: {
                    navHome: "Главная",
                    navSkills: "Навыки",
                    navProjects: "Проекты",
                    navContact: "Контакты",
                    heroTitle: "Frontend React Разработчик",
                    heroDesc: "Создание интерактивных, современных и высокопроизводительных веб-приложений.",
                    projectsTitle: "Мои Проекты",
                    skillsTitle: "Технические Навыки",
                    resumeBtn: "Резюме",
                    downloadResume: "Распечатать / Скачать резюме",
                    viewProject: "Смотреть проект",
                    close: "Закрыть",
                }
            };

            const skills = [
                { name: "HTML5", level: "95%", icon: "fa-html5 text-orange-500" },
                { name: "CSS3 / Tailwind", level: "90%", icon: "fa-css3-alt text-blue-500" },
                { name: "JavaScript (ES6+)", level: "88%", icon: "fa-js text-yellow-400" },
                { name: "React.js", level: "90%", icon: "fa-react text-cyan-400" },
                { name: "Node.js", level: "75%", icon: "fa-node text-green-500" },
            ];

            const projects = [
                { 
                    title: "Hotel Booking App", 
                    desc: "Hashamatli mehmonxonalarni bron qilish va online buyurtma platformasi.", 
                    tech: "React, Tailwind CSS",
                    detailsText: "Ushbu loyiha orqali foydalanuvchilar o'zlariga qulay mehmonxonalarni tanlab, bron qilishlari va xonalar haqida to'liq ma'lumot olishlari mumkin."
                },
                { 
                    title: "Doctor Appointment System", 
                    desc: "MediCare Prime - Shifokorlar qabuliga onlayn yozilish tizimi.", 
                    tech: "React, Node.js",
                    detailsText: "Tibbiyot markazlari uchun mo'ljallangan bo'lib, bemorlarga o'zlariga kerakli shifokorni tanlab, bo'sh vaqtlarga qabulga yozilish imkonini beradi."
                },
                { 
                    title: "LMS Learning Platform", 
                    desc: "O'quv markazlari va platformalar uchun ta'limni boshqarish tizimi.", 
                    tech: "React, Tailwind",
                    detailsText: "Talabalar va o'qituvchilar uchun maxsus platforma. Kurslarni kuzatish, vazifalarni topshirish va baholash tizimlarini o'z ichiga oladi."
                },
                { 
                    title: "Zeus Digital Agency", 
                    desc: "Raqamli agentliklar va IT studiyalar uchun zamonaviy platforma.", 
                    tech: "React, CSS3",
                    detailsText: "Brendlar va kompaniyalar uchun raqamli xizmatlarni taqdim etuvchi yuqori darajadagi animatsiyali veb-sayt interfeysi."
                }
            ];

            if (loading) {
                return (
                    <div className="fixed inset-0 bg-slate-950 flex flex-col items-center justify-center z-50">
                        <div className="text-center px-4">
                            <h1 className="text-3xl md:text-5xl font-extrabold text-white mb-4 tracking-wider">
                                MUHAMMADZIYO HOMIDJONOV
                            </h1>
                            <p className="text-blue-400 text-lg mb-6 font-medium">Portfolio yuklanmoqda...</p>
                            <div className="w-64 md:w-80 h-2.5 bg-slate-800 rounded-full overflow-hidden mx-auto border border-slate-700">
                                <div 
                                    className="h-full bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-75"
                                    style={{ width: `${progress}%` }}
                                ></div>
                            </div>
                            <span className="text-2xl font-bold text-white mt-4 block">{progress}%</span>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'} transition-colors duration-300 relative overflow-hidden`}>
                    
                    {/* QIMIRLAB TURUVCHI JONLI ORQA FON NURLARI */}
                    <div className="absolute top-0 left-1/4 w-[500px] h-[500px] bg-blue-600/15 rounded-full filter blur-[140px] pointer-events-none animate-blob1 z-0"></div>
                    <div className="absolute top-1/3 right-1/4 w-[500px] h-[500px] bg-indigo-600/15 rounded-full filter blur-[140px] pointer-events-none animate-blob2 z-0"></div>

                    {/* SICHQONCHA VA UNING ORTIDAN ERGASHUVCHI NEON KURSOR */}
                    {cursorVisible && (
                        <>
                            {/* Asosiy nuqta (to'g'ridan-to'g'ri kursor ostida) */}
                            <div 
                                className="fixed top-0 left-0 w-3 h-3 bg-blue-500 rounded-full pointer-events-none z-50 transform -translate-x-1/2 -translate-y-1/2 shadow-lg shadow-blue-500/90 hidden md:block"
                                style={{ transform: `translate3d(${mousePos.x}px, ${mousePos.y}px, 0) translate(-50%, -50%)` }}
                            ></div>
                            {/* Ortidan ergashib keluvchi silliq halqa */}
                            <div 
                                className="fixed top-0 left-0 w-10 h-10 border-2 border-blue-400/70 rounded-full pointer-events-none z-50 transform -translate-x-1/2 -translate-y-1/2 shadow-md shadow-indigo-500/30 hidden md:block transition-all ease-out"
                                style={{ transform: `translate3d(${trailPos.x}px, ${trailPos.y}px, 0) translate(-50%, -50%)` }}
                            ></div>
                        </>
                    )}

                    {/* NAVBAR */}
                    <header className="fixed top-0 left-0 w-full z-40 glass border-b border-slate-800/50">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
                                    M
                                </div>
                                <div>
                                    <span className="font-bold text-lg block leading-tight">Muhammadziyo</span>
                                    <span className="text-xs text-blue-400">Frontend Dev</span>
                                </div>
                            </div>

                            <nav className="hidden md:flex items-center space-x-8 font-medium text-sm">
                                <a href="#home" className="hover:text-blue-400 transition">{t[lang].navHome}</a>
                                <a href="#skills" className="hover:text-blue-400 transition">{t[lang].navSkills}</a>
                                <a href="#projects" className="hover:text-blue-400 transition">{t[lang].navProjects}</a>
                                <a href="#contact" className="hover:text-blue-400 transition">{t[lang].navContact}</a>
                            </nav>

                            <div className="flex items-center space-x-3 md:space-x-4">
                                <div className="flex bg-slate-800/50 p-1 rounded-xl border border-slate-700/50 text-xs font-semibold">
                                    {['UZ', 'ENG', 'RUS'].map((item) => (
                                        <button
                                            key={item}
                                            onClick={() => setLang(item)}
                                            className={`px-2.5 py-1.5 rounded-lg transition-all ${lang === item ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                        >
                                            {item}
                                        </button>
                                    ))}
                                </div>

                                <button 
                                    onClick={toggleTheme}
                                    className="p-2.5 rounded-xl bg-slate-800/50 border border-slate-700/50 text-yellow-400 hover:bg-slate-700/50 transition"
                                >
                                    <i className={`fa-solid ${darkMode ? 'fa-sun text-yellow-400' : 'fa-moon text-indigo-600'}`}></i>
                                </button>

                                <button 
                                    onClick={() => setIsResumeOpen(true)}
                                    className="px-4 py-2 md:px-5 md:py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold text-sm shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:scale-105 transition transform"
                                >
                                    {t[lang].resumeBtn}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* HERO */}
                    <section id="home" className="pt-36 pb-20 px-6 max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between relative z-10">
                        <div className="md:w-1/2 space-y-6 text-center md:text-left">
                            <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-sm font-medium">
                                <span className="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                                <span>Frontend React Developer</span>
                            </div>
                            <h1 className="text-4xl md:text-6xl font-extrabold tracking-tight leading-tight">
                                Salom, men <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Muhammadziyo Homidjonov</span>
                            </h1>
                            <p className="text-slate-400 text-lg max-w-xl">
                                {t[lang].heroDesc} (Tug'ilgan sana: 15-oktyabr, 2014-yil)
                            </p>
                            <div className="flex flex-wrap gap-4 justify-center md:justify-start pt-2">
                                <a 
                                    href="https://t.me/Bibihumoyrohon" 
                                    target="_blank" 
                                    rel="noreferrer"
                                    className="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold flex items-center space-x-2 shadow-lg shadow-blue-600/30 transition"
                                >
                                    <i className="fa-brands fa-telegram text-lg"></i>
                                    <span>Telegram</span>
                                </a>
                                <a 
                                    href="https://github.com/muhammadziyohamidjonov7-en" 
                                    target="_blank" 
                                    rel="noreferrer"
                                    className="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold flex items-center space-x-2 border border-slate-700 transition"
                                >
                                    <i className="fa-brands fa-github text-lg"></i>
                                    <span>GitHub</span>
                                </a>
                            </div>
                        </div>

                        <div className="md:w-1/2 mt-12 md:mt-0 flex justify-center">
                            <div className="relative w-72 h-72 md:w-96 md:h-96 rounded-3xl bg-gradient-to-tr from-blue-600 to-indigo-600 p-1 shadow-2xl animate-float">
                                <div className="w-full h-full bg-slate-900 rounded-[22px] flex flex-col items-center justify-center p-8 text-center relative overflow-hidden">
                                    <div className="absolute inset-0 bg-blue-500/10 animate-glow rounded-[22px]"></div>
                                    <i className="fa-solid fa-code text-6xl text-blue-400 mb-4"></i>
                                    <h3 className="text-2xl font-bold text-white mb-2">Clean Code & UI</h3>
                                    <p className="text-sm text-slate-400">HTML, CSS, JS, React, Tailwind & Node.js</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* SKILLS */}
                    <section id="skills" className="py-20 px-6 max-w-7xl mx-auto relative z-10">
                        <h2 className="text-3xl font-bold text-center mb-12">{t[lang].skillsTitle}</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
                            {skills.map((skill, index) => (
                                <div key={index} className="glass p-6 rounded-2xl flex flex-col items-center text-center hover:border-blue-500/50 transition transform hover:-translate-y-1">
                                    <i className={`fa-brands ${skill.icon} text-4xl mb-4`}></i>
                                    <h3 className="font-bold text-lg mb-1">{skill.name}</h3>
                                    <span className="text-sm text-blue-400 font-semibold">{skill.level}</span>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* PROJECTS */}
                    <section id="projects" className="py-20 px-6 max-w-7xl mx-auto relative z-10">
                        <h2 className="text-3xl font-bold text-center mb-12">{t[lang].projectsTitle}</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {projects.map((proj, idx) => (
                                <div key={idx} className="glass p-8 rounded-3xl hover:border-blue-500/50 transition group flex flex-col justify-between">
                                    <div>
                                        <div className="flex justify-between items-start mb-4">
                                            <h3 className="text-2xl font-bold group-hover:text-blue-400 transition">{proj.title}</h3>
                                            <span className="text-xs px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">{proj.tech}</span>
                                        </div>
                                        <p className="text-slate-400 mb-6">{proj.desc}</p>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedProject(proj)}
                                        className="text-blue-400 font-semibold flex items-center space-x-2 group-hover:translate-x-2 transition cursor-pointer text-left"
                                    >
                                        <span>{t[lang].viewProject}</span>
                                        <i className="fa-solid fa-arrow-right"></i>
                                    </button>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* PROJECT DETAILS MODAL */}
                    {selectedProject && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="glass w-full max-w-xl rounded-3xl p-8 relative">
                                <button 
                                    onClick={() => setSelectedProject(null)}
                                    className="absolute top-6 right-6 w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition cursor-pointer"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <span className="text-xs px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-semibold">
                                    {selectedProject.tech}
                                </span>
                                <h3 className="text-2xl font-bold mt-3 mb-2">{selectedProject.title}</h3>
                                <p className="text-slate-300 text-sm mb-6 leading-relaxed">{selectedProject.detailsText}</p>

                                <div className="flex space-x-4 pt-4 border-t border-slate-800">
                                    <a 
                                        href="https://github.com/muhammadziyohamidjonov7-en" 
                                        target="_blank" 
                                        rel="noreferrer"
                                        className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold text-sm flex items-center space-x-2 border border-slate-700 transition"
                                    >
                                        <i className="fa-brands fa-github text-lg"></i>
                                        <span>GitHub</span>
                                    </a>
                                    <button 
                                        onClick={() => setSelectedProject(null)}
                                        className="px-6 py-2.5 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-500 transition shadow-lg shadow-blue-600/30 cursor-pointer"
                                    >
                                        {t[lang].close}

                    )}

                    {/* FOOTER / CONTACT */}
                    <footer id="contact" className="glass border-t border-slate-800/50 py-12 px-6 mt-20 relative z-10">

                            <div>
                                <h3 className="text-xl font-bold mb-1">Muhammadziyo Homidjonov</h3>

                            <div className="flex space-x-4">
                                <a href="https://t.me/Bibihumoyrohon" target="_blank" rel="noreferrer" className="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-blue-400 hover:bg-blue-600 hover:text-white transition">
                                    <i className="fa-brands fa-telegram text-lg"></i>
                                </a>
                                <a href="https://github.com/muhammadziyohamidjonov7-en" target="_blank" rel="noreferrer" className="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-white hover:bg-slate-700 transition">

                                </a>
                                <a href="tel:+998905899213" className="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-green-400 hover:bg-green-600 hover:text-white transition">
